[project]
name = "postback-debugger"
version = "0.1.0"
description = "AI agent that diagnoses failed ad network postbacks"
authors = [
    { name = "Anant Kumar Subham", email = "skyanant123@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.1",
]

[project.scripts]
postback-debugger = "postback_debugger:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
